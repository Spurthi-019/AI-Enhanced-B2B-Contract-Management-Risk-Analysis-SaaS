spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5433/contractiq
    username: contractiq
    password: devpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    mongodb:
      uri: mongodb://contractiq:devpassword@localhost:27017/contractiq?authSource=admin

server:
  port: 8081

security:
  jwt:
    secret: your_secure_base64_jwt_signing_key_here_must_be_at_least_256_bits
    expiration-ms: 86400000

logging:
  level:
    org.springframework.security: DEBUG
