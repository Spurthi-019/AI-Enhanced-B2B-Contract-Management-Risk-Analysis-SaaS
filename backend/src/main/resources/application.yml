spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5433/contractiq
    username: contractiq
    password: devpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    mongodb:
      uri: mongodb://contractiq:devpassword@localhost:27017/contractiq?authSource=admin
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: mock-username
    password: mock-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8081

security:
  jwt:
    secret: 3c963f221415d556488339bcfefd38392138bc9e96e54e4df0c0612c6f1a8c9e
    expiration-ms: 86400000

logging:
  level:
    org.springframework.security: DEBUG
